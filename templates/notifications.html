{% extends 'base.html' %}
{% load static %}
{% block title %}Thông báo – Nguyễn Văn Huyên Learning{% endblock %}
{% block content %}
<div class="app-shell">
{% include 'components/app_sidebar.html' %}
<div class="app-main">
<div class="container py-4" style="max-width:700px;">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 style="font-size:1.6rem; font-weight:800; margin:0;">
                <i class="bi bi-bell-fill me-2" style="color:var(--color-primary,#4f46e5);"></i>Thông báo
            </h1>
            <p class="text-muted small mb-0 mt-1">Tất cả thông báo của bạn</p>
        </div>
        <button id="pageMarkAllBtn"
            class="btn btn-sm px-3"
            style="background:var(--color-primary,#4f46e5);color:#fff;border-radius:10px;font-weight:600;border:none;">
            <i class="bi bi-check2-all me-1"></i>Đọc tất cả
        </button>
    </div>

    <!-- Loading -->
    <div id="notifPageLoading" class="text-center py-5">
        <div class="spinner-grow text-primary" role="status"></div>
        <p class="mt-3 text-muted small">Đang tải thông báo...</p>
    </div>

    <!-- Notification List -->
    <div id="notifPageList" style="display:none;"></div>

    <!-- Pagination -->
    <div id="notifPagePagination" class="d-flex justify-content-center mt-4 gap-2"></div>
</div>
</div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/notifications.js' %}"></script>
{% endblock %}
